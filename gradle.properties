# JVM settings. 4 GB keeps R8 (release) and the Compose/KSP compiler passes comfortable.
# No machine-specific paths and no OS-specific system properties: the Windows-only
# -Djavax.net.ssl.trustStoreType=WINDOWS-ROOT that used to live here broke HTTPS on
# Linux/macOS because "WINDOWS-ROOT" is not a KeyStore type there. If a Windows machine
# has a broken JDK trust store, put that flag in %USERPROFILE%\.gradle\gradle.properties.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
# Parallel IDE sync (Gradle 9.4+).
org.gradle.tooling.parallel=true

android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# AGP 9 defaults are used as-is: android.newDsl=true and android.builtInKotlin=true.
# Do not add the transitional android.newDsl=false / android.builtInKotlin=false /
# android.disallowKotlinSourceSets=false flags; AGP 10 removes them.
