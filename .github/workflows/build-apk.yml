name: Build AETHER debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - arena/b1d244c1-adshieldpro

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Install Android 36 platform and build tools
        run: |
          sdkmanager --install "platforms;android-36" "platform-tools" "build-tools;35.0.0" > /dev/null
          sdkmanager --install "build-tools;36.0.0" > /dev/null || true

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: JVM unit tests (informational)
        continue-on-error: true
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: adshield-aether-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
