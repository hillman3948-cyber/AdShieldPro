name: Build AETHER debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - arena/b1d244c1-adshieldpro
    paths-ignore:
      - 'build-logs/**'
      - 'apk/**'

jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Configure preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMGR" ]; then SDKMGR=sdkmanager; fi
          yes | "$SDKMGR" --licenses > /dev/null || true
          "$SDKMGR" --install "platforms;android-36" "platform-tools" "build-tools;35.0.0" > /dev/null || true
          "$SDKMGR" --install "build-tools;36.0.0" > /dev/null || true
          "$SDKMGR" --list_installed | grep -E "android-36|build-tools" || true

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Assemble debug APK
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee gradle-assemble.log

      - name: Surface Gradle errors as annotations
        if: failure()
        run: |
          grep -E "FAILURE:|error:|^e: |What went wrong|Execution failed|Caused by|Unresolved reference|Could not|not found" gradle-assemble.log \
            | head -12 | while IFS= read -r line; do echo "::error::$line"; done || true

      - name: Publish Gradle log to branch for inspection
        if: failure() && github.event_name == 'workflow_dispatch'
        run: |
          mkdir -p build-logs
          cp gradle-assemble.log build-logs/gradle-assemble.log
          git config user.name "Arena APK Builder"
          git config user.email "agent@arena.ai"
          git add build-logs/gradle-assemble.log
          git commit -m "APK build log [skip ci]" || exit 0
          git push origin HEAD:arena/b1d244c1-adshieldpro

      - name: JVM unit tests (informational)
        continue-on-error: true
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: adshield-aether-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish APK to branch for delivery
        if: success() && github.event_name == 'workflow_dispatch'
        run: |
          mkdir -p apk
          APK="$(ls app/build/outputs/apk/debug/*.apk | head -1)"
          cp "$APK" apk/app-debug.apk
          sha256sum apk/app-debug.apk | tee apk/app-debug.apk.sha256
          ls -lh apk/app-debug.apk
          git config user.name "Arena APK Builder"
          git config user.email "agent@arena.ai"
          git add -f apk/app-debug.apk apk/app-debug.apk.sha256
          git commit -m "Deliver debug APK [skip ci]" || exit 0
          git push origin HEAD:arena/b1d244c1-adshieldpro
